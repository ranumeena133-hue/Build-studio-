// ऐप मॉड्यूल — ध्यान दो: dependencies बिलकुल खाली हैं (कोई library नहीं)
apply plugin: 'com.android.application'

android {
    namespace 'com.buildstudio.sync'
    compileSdk 34

    defaultConfig {
        applicationId "com.buildstudio.sync"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // जान-बूझकर खाली — सिर्फ Java + XML
}
